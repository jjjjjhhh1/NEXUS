  </g>
  <g transform="translate(884 80)">
    <rect width="236" height="220" rx="38" fill="#06111f" stroke="#294866" stroke-width="2"/>
    <path d="M58 160V60l120 100V60" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="60" r="12" fill="#35d8d0"/><circle cx="178" cy="160" r="12" fill="#4c83ff"/>
  </g>
